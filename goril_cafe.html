<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🦍 GORİL Cafe Yönetim</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:radial-gradient(circle at top,#263238,#0b0f10 60%);color:#f8fafc}
header{padding:16px;background:#161a1b;border-bottom:2px solid #d97706;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:3}
h1{font-size:20px;margin:0}.wrap{padding:14px;max-width:1200px;margin:auto}
nav{display:flex;gap:8px;overflow:auto;padding:10px 0}button,.btn{border:0;border-radius:9px;padding:10px 13px;background:#2563eb;color:white;font-weight:700;cursor:pointer}
nav button{background:#1f2937}.active{background:#2563eb!important}.danger{background:#dc2626}.green{background:#16a34a}.gray{background:#475569}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.card{background:#1e293b;border-radius:14px;padding:14px;box-shadow:0 4px 12px #0004}
.card h3{margin:0 0 8px}.muted{color:#94a3b8;font-size:13px}.price{font-size:24px;font-weight:800}.timer{font-size:25px;font-weight:800;margin:8px 0;color:#67e8f9}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1}.small{flex:0 0 auto}
input,select{width:100%;padding:10px;border-radius:8px;border:1px solid #475569;background:#0f172a;color:white}
table{width:100%;border-collapse:collapse;background:#1e293b;border-radius:10px;overflow:hidden}th,td{padding:10px;border-bottom:1px solid #334155;text-align:left}
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:15px;z-index:10}.modal>div{background:#1e293b;padding:20px;border-radius:15px;width:min(500px,100%)}
.badge{padding:5px 8px;border-radius:20px;background:#334155;font-size:12px}.on{background:#166534}.off{background:#475569}
.section{display:none}.section.show{display:block}.total{font-size:30px;font-weight:900}
</style>
</head>
<body>
<header><h1>🦍 GORİL CAFE</h1><span id="clock"></span></header>
<div class="wrap">
<nav>
<button class="active" onclick="tab('dashboard',this)">Ana Sayfa</button>
<button onclick="tab('tables',this)">Masalar</button>
<button onclick="tab('menu',this)">Menü & Sipariş</button>
<button onclick="tab('reports',this)">Kasa / Rapor</button>
<button onclick="tab('settings',this)">Ayarlar</button>
</nav>

<section id="dashboard" class="section show">
<div class="grid" id="stats"></div><br><div class="grid" id="quick"></div>
</section>

<section id="tables" class="section">
<div class="row"><h2 style="flex:1">Masalar</h2><button class="small" onclick="addTable()">+ Masa Ekle</button></div>
<div class="grid" id="tableGrid"></div>
</section>

<section id="menu" class="section">
<div class="row"><h2>🦍 Menü & Sipariş</h2><button class="small" onclick="addProduct()">+ Ürün Ekle</button></div>
<div class="card" style="margin-bottom:12px"><label>Ürünün ekleneceği aktif masa
<select id="selectedTable"><option value="">-- Masa seç --</option></select></label></div>
<div class="grid" id="menuGrid"></div>
</section>

<section id="reports" class="section">
<h2>Kasa / Rapor</h2><div id="report"></div>
</section>

<section id="settings" class="section">
<h2>Ayarlar</h2>
<div class="card">
<p>Varsayılan saatlik ücretler ve uygulama verileri cihazında saklanır.</p>
<div class="row"><label>PS saatlik ücret<input id="psRate" type="number"></label>
<label>Okey saatlik ücret<input id="okeyRate" type="number"></label></div><br>
<button onclick="saveRates()">Ücretleri Kaydet</button>
<button class="danger" onclick="resetAll()">Tüm Verileri Sıfırla</button>
</div>
</section>
</div>

<div class="modal" id="modal"><div id="modalBody"></div></div>

<script>
const key='ps_okey_cafe_v1';
let db=JSON.parse(localStorage.getItem(key)||'null')||{
 rates:{PS:100,Okey:80},
 tables:[
  ...Array.from({length:8},(_,i)=>({id:'PS-'+(i+1),type:'PS',name:'PS '+(i+1),active:false,start:null,orders:[]})),
  ...Array.from({length:4},(_,i)=>({id:'OKEY-'+(i+1),type:'Okey',name:'Okey '+(i+1),active:false,start:null,orders:[]}))
 ],
 products:[
  {id:1,name:'Çay',price:15},{id:2,name:'Su',price:10},{id:3,name:'Kola',price:35},
  {id:4,name:'Tost',price:80},{id:5,name:'Kahve',price:45}
 ],
 sales:[]
};
function save(){localStorage.setItem(key,JSON.stringify(db));render()}
function money(x){return Number(x||0).toLocaleString('tr-TR',{minimumFractionDigits:2})+' TL'}
function elapsed(t){return t?Math.max(0,Date.now()-t):0}
function duration(t){let s=Math.floor(elapsed(t)/1000),h=Math.floor(s/3600);s%=3600;let m=Math.floor(s/60);s%=60;return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
function tab(id,b){document.querySelectorAll('.section').forEach(x=>x.classList.remove('show'));document.getElementById(id).classList.add('show');document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()}
function tableTotal(t){
 let time=t.active ? elapsed(t.start)/3600000 : (t.lastDuration||0)/3600000;
 let base=time*db.rates[t.type];
 return base+t.orders.reduce((a,o)=>a+o.price*o.qty,0);
}
function render(){
 document.getElementById('clock').textContent=new Date().toLocaleTimeString('tr-TR');
 let active=db.tables.filter(t=>t.active).length, revenue=db.sales.reduce((a,s)=>a+s.total,0)+db.tables.reduce((a,t)=>a+(t.active?tableTotal(t):0),0);
 document.getElementById('stats').innerHTML=[
  ['🟢 Aktif Masalar',active],['💰 Bugünkü Kasa',money(revenue)],['🎮 PS',db.tables.filter(t=>t.type==='PS').length],['🃏 Okey',db.tables.filter(t=>t.type==='Okey').length]
 ].map(x=>`<div class="card"><div class="muted">${x[0]}</div><div class="price">${x[1]}</div></div>`).join('');
 document.getElementById('quick').innerHTML='<div class="card"><h3>Hızlı Başlat</h3><div class="row">'+db.tables.filter(t=>!t.active).slice(0,6).map(t=>`<button onclick="start('${t.id}')">${t.name}</button>`).join('')+'</div></div>';
 document.getElementById('tableGrid').innerHTML=db.tables.map(t=>`
 <div class="card"><div class="row"><h3>${t.name}</h3><span class="badge ${t.active?'on':'off'}">${t.active?'AKTİF':'BOŞ'}</span></div>
 <div class="muted">${t.type} • Saatlik ${money(db.rates[t.type])}</div>
 <div class="timer">${t.active?duration(t.start):'00:00:00'}</div>
 <div>Hesap: <b>${money(tableTotal(t))}</b></div>
 <br><div class="row">
 ${t.active?`<button class="danger" onclick="finish('${t.id}')">Hesabı Kapat</button><button class="gray" onclick="order('${t.id}')">Sipariş</button>`:`<button class="green" onclick="start('${t.id}')">Başlat</button>`}
 </div></div>`).join('');
 let st=document.getElementById('selectedTable');
if(st){
 let old=st.value;
 st.innerHTML='<option value="">-- Masa seç --</option>'+db.tables.filter(t=>t.active).map(t=>`<option value="${t.id}">${t.name}</option>`).join('');
 if(db.tables.some(t=>t.id===old&&t.active))st.value=old;
}
document.getElementById('menuGrid').innerHTML=db.products.map(p=>`<div class="card"><h3>${p.name}</h3><div class="price">${money(p.price)}</div><br><button onclick="quickOrder(${p.id})">🦍 Seçili Masaya Ekle</button> <button class="danger" onclick="delProduct(${p.id})">Sil</button></div>`).join('');
 let today=db.sales.filter(s=>new Date(s.date).toDateString()===new Date().toDateString());
 document.getElementById('report').innerHTML=`<div class="card"><div class="total">${money(today.reduce((a,s)=>a+s.total,0))}</div><div class="muted">Kapanmış hesaplar / bugün</div><hr><table><tr><th>Masa</th><th>Tutar</th><th>Zaman</th></tr>${today.slice().reverse().map(s=>`<tr><td>${s.table}</td><td>${money(s.total)}</td><td>${new Date(s.date).toLocaleTimeString('tr-TR')}</td></tr>`).join('')||'<tr><td colspan="3">Henüz kayıt yok.</td></tr>'}</table></div>`;
 document.getElementById('psRate').value=db.rates.PS;document.getElementById('okeyRate').value=db.rates.Okey;
}
function start(id){let t=db.tables.find(x=>x.id===id);t.active=true;t.start=Date.now();t.lastDuration=0;save()}
function finish(id){let t=db.tables.find(x=>x.id===id);let total=tableTotal(t);db.sales.push({table:t.name,total,date:Date.now()});t.active=false;t.lastDuration=0;t.start=null;t.orders=[];save();alert('Hesap kapandı: '+money(total))}
function order(id){
 let t=db.tables.find(x=>x.id===id);
 document.getElementById('modalBody').innerHTML=`<h2>${t.name} Sipariş</h2>${db.products.map(p=>`<div class="row" style="margin:8px 0"><span>${p.name} — ${money(p.price)}</span><button class="small" onclick="addOrder('${id}',${p.id})">Ekle</button></div>`).join('')}<br><button class="gray" onclick="closeModal()">Kapat</button>`;
 document.getElementById('modal').style.display='flex';
}
function addOrder(tid,pid){let t=db.tables.find(x=>x.id===tid),p=db.products.find(x=>x.id===pid),o=t.orders.find(x=>x.productId===pid);o?o.qty++:t.orders.push({productId:pid,name:p.name,price:p.price,qty:1});closeModal();save()}
function quickOrder(pid){
 let sel=document.getElementById('selectedTable');
 let tid=sel?sel.value:'';
 if(!tid)return alert('Önce yukarıdan bir aktif masa seç.');
 let t=db.tables.find(x=>x.id===tid);
 if(!t||!t.active)return alert('Seçilen masa aktif değil.');
 addOrder(t.id,pid);
}
function addProduct(){let n=prompt('Ürün adı?');if(!n)return;let p=Number(prompt('Fiyat?'));if(!p)return;db.products.push({id:Date.now(),name:n,price:p});save()}
function delProduct(id){if(confirm('Ürün silinsin mi?')){db.products=db.products.filter(p=>p.id!==id);save()}}
function addTable(){let type=prompt('PS veya Okey?','PS');type=(type||'PS').toLowerCase().startsWith('o')?'Okey':'PS';let n=prompt('Masa adı?');if(n)db.tables.push({id:Date.now()+'',type,name:n,active:false,start:null,orders:[]});save()}
function saveRates(){db.rates.PS=Number(document.getElementById('psRate').value)||0;db.rates.Okey=Number(document.getElementById('okeyRate').value)||0;save();alert('Ücretler kaydedildi.')}
function resetAll(){if(confirm('Tüm masa, ürün ve kasa verileri silinsin mi?')){localStorage.removeItem(key);location.reload()}}
function closeModal(){document.getElementById('modal').style.display='none'}
setInterval(render,1000);render();
</script>
</body></html>
